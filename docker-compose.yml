services:
  nexus_postgres:
    image: postgis/postgis:15-3.3
    container_name: nexus_postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secret
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexus_net

  nexus_pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nexus_pgbouncer
    environment:
      DATABASE_URL: postgresql://nexus:nexus_secret@nexus_postgres:5432/nexus
      AUTH_TYPE: any
    ports:
      - "6432:5432"
    depends_on:
      nexus_postgres:
        condition: service_healthy
    networks:
      - nexus_net

  nexus_mongodb:
    image: mongo:7.0
    container_name: nexus_mongodb
    environment:
      MONGO_INITDB_DATABASE: nexus_ingestion
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: nexus_secret
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_net

  nexus_redis:
    image: redis:7.2-alpine
    container_name: nexus_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nexus_net

  nexus_elasticsearch:
    image: elasticsearch:8.11.0
    container_name: nexus_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - nexus_net

  nexus_zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - nexus_net

  nexus_kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus_kafka
    depends_on:
      nexus_zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nexus_zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://nexus_kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - nexus_net

  nexus_kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexus_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: nexus_kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: nexus_zookeeper:2181
    depends_on:
      nexus_kafka:
        condition: service_healthy
    networks:
      - nexus_net

networks:
  nexus_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  es_data:
