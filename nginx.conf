events {
    worker_connections 1024;
}

http {
    # Include standard mime types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Backend upstream mapping
    upstream auth_service {
        server auth_service:8000;
    }
    upstream registry_service {
        server registry_service:8001;
    }
    upstream ingestion_service {
        server ingestion_service:8002;
    }
    upstream coordination_service {
        server coordination_service:8003;
    }
    upstream intelligence_service {
        server intelligence_service:8004;
    }
    upstream analytics_service {
        server analytics_service:8005;
    }
    upstream gateway_ws {
        server gateway_service:8006;
    }

    server {
        listen 80;
        server_name localhost;

        # Global CORS and headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Route matching for frontend API calls
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/registry/ {
            proxy_pass http://registry_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ingestion/ {
            proxy_pass http://ingestion_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/coordination/ {
            proxy_pass http://coordination_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/intelligence/ {
            proxy_pass http://intelligence_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/analytics/ {
            proxy_pass http://analytics_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket endpoint
        location /socket.io/ {
            proxy_pass http://gateway_ws/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400; # keep-alive WS
        }
    }
}
